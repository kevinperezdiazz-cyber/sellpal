# ============================================================
# Perfil "render": se activa en la nube junto con "postgresql"
#   SPRING_PROFILES_ACTIVE=postgresql,render
# Las credenciales NUNCA van aqui: se leen de variables de entorno.
# ============================================================

# Render entrega el puerto en la variable PORT
server.port=${PORT:8080}
# Detras del proxy HTTPS de Render
server.forward-headers-strategy=framework

# Base de datos (Neon)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool pequeno: poca RAM y Neon se duerme tras unos minutos sin uso
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000

# Las tablas se crean con database/SELLPAL_TODO_EN_UNO.sql; JPA solo completa lo que falte
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Menos ruido en logs (ahorra CPU y memoria)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=INFO
