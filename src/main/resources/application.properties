spring.application.name=sellpal-springboot
server.port=8080

# Default profile
spring.profiles.active=postgresql
# Mantiene las tablas y sincroniza automáticamente los cambios
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de IntelliJ cada sentencia SQL en tiempo real
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Muestra cuándo inicia, hace commit o hace rollback de la transacción
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=TRACE
