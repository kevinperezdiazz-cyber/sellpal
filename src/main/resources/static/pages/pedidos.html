<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Pedidos | SELLPAL INVERCAJAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-notice-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <i class="bi bi-shield-check me-1 text-warning"></i>
        <span>Canal Oficial de Distribución <strong>INVERCAJAS S.A.S.</strong></span>
      </div>
      <div class="d-none d-md-flex align-items-center gap-3">
        <span><i class="bi bi-telephone-fill me-1 text-warning"></i> PBX: (601) 745-8900</span>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-corporate sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <img src="../assets/img/logo_invercajas.svg" alt="SELLPAL INVERCAJAS" height="40">
      </a>
      
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item">
            <a class="nav-link" href="../index.html"><i class="bi bi-house-door me-1"></i> Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="catalogo.html"><i class="bi bi-grid me-1"></i> Catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="pedidos.html"><i class="bi bi-bag-check me-1"></i> Mis Pedidos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../index.html#contacto"><i class="bi bi-chat-dots me-1"></i> Contacto</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
          <a href="carrito.html" class="cart-icon-btn" title="Ver carrito">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="cart-badge" style="display: none;">0</span>
          </a>
          <div id="navbarUserContainer"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="bg-dark text-white py-4 border-bottom border-primary" style="background: linear-gradient(135deg, #071629 0%, #153b68 100%);">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-1 small text-light opacity-75">
          <li class="breadcrumb-item"><a href="../index.html" class="text-light text-decoration-none">Inicio</a></li>
          <li class="breadcrumb-item active text-warning" aria-current="page">Mis Pedidos</li>
        </ol>
      </nav>
      <h2 class="fw-bold mb-0"><i class="bi bi-receipt text-warning me-2"></i>Historial y Estado de Pedidos</h2>
    </div>
  </header>

  <!-- Contenido de Pedidos -->
  <main class="py-5">
    <div class="container">
      
      <!-- Filtros de Estado Visuales -->
      <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-sm btn-primary order-status-filter active rounded-pill px-3" data-status="all">
              Todos los Pedidos
            </button>
            <button class="btn btn-sm btn-outline-secondary order-status-filter rounded-pill px-3" data-status="Pendiente">
              <i class="bi bi-clock-history me-1 text-warning"></i> Pendiente
            </button>
            <button class="btn btn-sm btn-outline-secondary order-status-filter rounded-pill px-3" data-status="Procesando">
              <i class="bi bi-gear-wide-connected me-1 text-primary"></i> Procesando
            </button>
            <button class="btn btn-sm btn-outline-secondary order-status-filter rounded-pill px-3" data-status="Enviado">
              <i class="bi bi-truck me-1 text-info"></i> Enviado
            </button>
            <button class="btn btn-sm btn-outline-secondary order-status-filter rounded-pill px-3" data-status="Entregado">
              <i class="bi bi-check2-circle me-1 text-success"></i> Entregado
            </button>
            <button class="btn btn-sm btn-outline-secondary order-status-filter rounded-pill px-3" data-status="Cancelado">
              <i class="bi bi-x-circle me-1 text-danger"></i> Cancelado
            </button>
          </div>

          <div>
            <a href="catalogo.html" class="btn btn-accent btn-sm">
              <i class="bi bi-cart-plus me-1"></i> Nuevo Pedido
            </a>
          </div>
        </div>
      </div>

      <!-- Contenedor de las tarjetas de pedidos -->
      <div id="ordersContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-2">Cargando tus pedidos...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-corporate">
    <div class="container text-center">
      <img src="../assets/img/logo_invercajas.svg" alt="SELLPAL" height="36" class="mb-2">
      <p class="small text-light opacity-75 mb-0">&copy; 2026 SELLPAL / INVERCAJAS S.A.S. Plataforma Mayorista.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Orders.initOrdersPage();
    });
  </script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
